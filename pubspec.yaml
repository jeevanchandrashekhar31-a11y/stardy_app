name: stardy_app
description: "AI based E-learning Flutter application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  fl_chart: ^1.1.1
  http: ^1.1.0
  google_fonts: ^6.1.0
  video_player: ^2.14.1
  flutter_riverpod: ^2.5.1
  cached_network_image: ^3.3.1
  font_awesome_flutter: ^10.12.0
  url_launcher: ^6.3.2
  shared_preferences: ^2.2.2
  go_router: ^13.0.0
  carousel_slider: ^5.0.0

  # Backend SDKs — see lib/services/ for usage. Requires a Firebase project
  # (google-services.json / GoogleService-Info.plist) to actually connect;
  # calls fail gracefully until one is configured.
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.1
  file_picker: ^8.1.2
  uuid: ^4.6.0
  equatable: ^2.1.0
  clock: ^1.1.2
  sentry_flutter: ^8.14.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  mocktail: ^1.0.3
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  url_launcher_platform_interface: ^2.3.2
  plugin_platform_interface: ^2.1.8
  video_player_platform_interface: ^6.9.0
  fake_async: ^1.3.3

flutter:
  uses-material-design: true

  assets:
    - assets/images/
   

# THIS MUST BE OUTSIDE flutter & dependencies
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "stardy_app/assets/images/stardy-logo.png"